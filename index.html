<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stella Sora · Live2D Viewer</title>
<script src="./js/live2dcubismcore.min.js"></script>
<script type="importmap">
{
  "imports": {
    "pixi.js": "./js/pixi.min.mjs"
  }
}
</script>
<style>
  :root {
    --bg: #161616;
    --panel: #1a1a1a;
    --card: #222;
    --card2: #1e1e1e;
    --border: #333;
    --border2: #444;
    --text: #ccc;
    --text-dim: #777;
    --text-faint: #666;
    --accent: #17c9d3;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Consolas', 'SF Mono', monospace;
    font-size: 13px;
    overflow: hidden;
  }

  #app {
    display: flex;
    height: 100vh;
  }

  #main-canvas {
    flex: 1;
    position: relative;
    height: 100%;
  }
  #main-canvas canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #main-canvas canvas:active { cursor: grabbing; }

  /* Top bar */
  #topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(26, 26, 26, 0.85);
    border-bottom: 1px solid var(--border);
  }
  #topbar h1 {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .tool {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border2);
    color: var(--text-dim);
    padding: 3px 8px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .tool:hover { background: #2e2e2e; color: var(--text); }
  .tool input[type="color"] { display: none; }
  .tool .swatch {
    width: 12px;
    height: 12px;
    border: 1px solid var(--border2);
    display: inline-block;
  }
  #bginput, #status { display: none; }
  #status {
    margin-left: auto;
    font-size: 11px;
    color: var(--text-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Side panels (shared) */
  .panel {
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 20;
    width: 280px;
    max-width: 280px;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    transition: transform 0.18s ease;
    overflow: hidden;
  }
  .panel.left {
    left: 0;
    border-right: 1px solid var(--border);
    transform: translateX(-100%);
  }
  .panel.right {
    right: 0;
    border-left: 1px solid var(--border);
    transform: translateX(100%);
  }
  .panel.open { transform: translateX(0); }

  .panel-toggle {
    position: absolute;
    top: 48px;
    z-index: 19;
    width: 34px;
    height: 34px;
    background: var(--card);
    border: 1px solid var(--border2);
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
  }
  .panel-toggle.left { left: 12px; }
  .panel-toggle.right { right: 12px; }
  .panel-toggle:hover { background: #2e2e2e; color: var(--text); }

  .panel_top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  .panel_title {
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--text-dim);
  }
  .panel_close {
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 6px;
  }
  .panel_close:hover { color: var(--text); }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px;
    min-width: 0;
  }
  .panel-body::-webkit-scrollbar { width: 8px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border2); }
  .panel-body::-webkit-scrollbar-track { background: var(--bg); }

  /* Selection list */
  #entity-list { list-style: none; }

  .entity-filter {
    width: 100%;
    box-sizing: border-box;
    padding: 5px 8px;
    margin-bottom: 4px;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 12px;
  }
  .entity-filter:focus { outline: none; border-color: var(--accent); }

  .character-name {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    padding: 5px 8px;
    font-size: 13px;
    font-weight: bold;
    color: var(--text);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    user-select: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .character-name:hover { color: var(--accent); }
  .character-name .character-id {
    color: var(--text-faint);
    font-weight: normal;
    font-size: 11px;
  }
  .character-name.is-disc.active { color: #b8a25a; }

  .entity-section {
    padding: 6px 8px 4px;
    margin-top: 8px;
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border);
  }
  .entity-section:first-child { margin-top: 0; }

  .character-variation {
    list-style: none;
    margin: 2px 0 8px 14px;
  }
  .character-variation_button {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    padding: 3px 8px;
    margin: 1px 0;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .character-variation_button:hover {
    background: var(--card);
    color: var(--text);
    border-left-color: var(--accent);
  }
  .character-variation_button.active {
    background: var(--card);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .character-variation_button.is-disc:hover {
    border-left-color: #b8a25a;
  }
  .character-variation_button.is-disc.active {
    color: #b8a25a;
    border-left-color: #b8a25a;
  }

  /* Options panel */
  .opt-section {
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  .opt-section h3 {
    font-size: 10px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .opt-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 4px 0;
    min-width: 0;
  }
  .opt-row label {
    flex: 0 0 auto;
    min-width: 52px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .opt-row input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .opt-row .opt-value {
    flex: 0 0 auto;
    min-width: 40px;
    text-align: right;
    font-size: 11px;
    color: var(--text);
  }
  .opt-row .opt-reset {
    flex: 0 0 auto;
    background: none;
    border: 1px solid var(--border2);
    color: var(--text-faint);
    font-size: 10px;
    padding: 1px 6px;
    cursor: pointer;
  }
  .opt-row .opt-reset:hover { color: var(--text); border-color: var(--text-dim); }
  .opt-row select {
    flex: 1;
    min-width: 0;
    max-width: 100%;
    background: var(--card);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    padding: 2px 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .opt-row select option {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 240px;
  }
  .opt-check {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 4px 0;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .opt-check input { accent-color: var(--accent); }
  .opt-buttons {
    display: flex;
    gap: 6px;
    margin-top: 6px;
  }
  .opt-buttons button {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border2);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
  }
  .opt-buttons button:hover { background: #2e2e2e; color: var(--text); }
  .opt-param {
    margin: 4px 0;
  }
  .opt-param .opt-param-head {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .opt-param .opt-param-head label {
    flex: 1;
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .opt-param .opt-param-slider {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: 18px;
  }
  .opt-param .opt-param-slider input[type="range"] { flex: 1; accent-color: var(--accent); }
  .opt-param .opt-param-slider .opt-value { font-size: 10px; }

  @media (max-width: 600px) {
    .panel { width: 240px; }
    #topbar h1 { font-size: 10px; letter-spacing: 1px; }
    .tool { padding: 2px 5px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="main-canvas"></div>

  <div id="topbar">
    <h1 id="page-title">Stella Sora · Live2D Viewer</h1>
    <button class="tool" id="bgcolor" type="button">
      <span class="swatch" id="bgcolor-swatch"></span> Background
    </button>
    <input type="color" id="bginput" value="#161616" />
  </div>
  <span id="status"></span>

  <button id="entity-list_open" class="panel-toggle left" type="button" title="Characters">▦</button>
  <button id="options_open" class="panel-toggle right" type="button" title="Options">⚙</button>

  <div id="entity-list_wrapper" class="panel left">
    <div class="panel_top">
      <div class="panel_title">Characters</div>
      <button id="entity-list_close" class="panel_close" type="button">✕</button>
    </div>
    <div class="panel-body">
      <input id="entity-filter" class="entity-filter" type="text"
             value="8133 8134" title="Hide entries whose id starts with any of these (space/comma separated)" placeholder="Hide ids…">
      <ul id="entity-list"></ul>
    </div>
  </div>

  <div id="options_wrapper" class="panel right">
    <div class="panel_top">
      <div class="panel_title">Options</div>
      <button id="options_close" class="panel_close" type="button">✕</button>
    </div>
    <div class="panel-body" id="options-content"></div>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
